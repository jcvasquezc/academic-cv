# Academic service (editorial roles, reviewing, committees...), shown at the
# bottom of the Publications page (layouts/publications/list.html) by the
# `academic-service` block in layouts/_partials/hbx/blocks/academic-service/.
#
# Service is organised in groups, shown in the order listed here.
# Each group has:
#   title:   heading shown on the page (e.g. Editorial Roles, Reviewing)
#   compact: true  -> one-line list (good for long reviewer / committee lists)
#            false -> detailed cards (default)
#   columns: 2     -> split a compact list into two columns on wide screens
#   note:    optional line under the heading (Markdown)
#   items:   list of entries
#
# Every entry field is optional; empty ones are skipped.
#   role:       your role (Guest Editor, Reviewer, TPC Member, Session Chair, ...)
#   kind:       type of activity (Special Issue, Journal, Conference, Workshop, ...)
#   title:      name of the special issue / session / workshop
#   venue:      journal or conference (e.g. Sensors, Interspeech 2025)
#   publisher:  e.g. MDPI, IEEE, Elsevier, ISCA
#   section:    journal section (optional)
#   url:        link (title, or venue when there is no title, becomes clickable)
#   period:     free text, e.g. "2023", "2021–present"
#   deadline:   submission deadline (YYYY-MM-DD), shows an Open/Closed badge
#   status:     Open / Closed, overrides the badge computed from the deadline
#   co_editors: list of co-editors / co-organisers
#   keywords:   list of keywords
#   summary:    one or two sentences

groups:
  - title: Editorial Roles
    items:
      - role: Guest Editor
        kind: Special Issue
        title: Sensors in Multimedia Forensics
        venue: Sensors
        publisher: MDPI
        section: Intelligent Sensors
        url: https://www.mdpi.com/journal/sensors/special_issues/W35V7UX396
        period: ""
        deadline: ""
        keywords:
          - Multimedia forensics
          - Digital forensics
          - Deepfake detection
          - Tampering detection
          - Audio processing
          - Image and video analysis
          - Biometric identification
        summary: "Explores how sensor technologies advance multimedia forensics: sensor-based approaches for the analysis, processing and authentication of images, video and audio, including tampering and deepfake detection."

