bio: |
  I'm an Associate Researcher at <a href="https://www.vicomtech.org/en" target="_blank" rel="noopener noreferrer">Vicomtech</a> (since 2022). I do research on machine learning and speech processing, with a focus on multilingual ASR, emotion-aware avatar animation, voice anti-spoofing, and speech-based health assessment. 
  I completed a joint PhD in machine learning and speech processing between <a href="https://www.udea.edu.co" target="_blank" rel="noopener noreferrer">Universidad de Antioquia</a> and the Pattern Recognition Lab at <a href="https://www.fau.eu/" target="_blank" rel="noopener noreferrer">FAU Erlangen-Nürnberg</a> (2018–2022). 
  With over 9 years across academia and industry, I turn research into systems for accessibility, healthcare, and human–computer interaction.

